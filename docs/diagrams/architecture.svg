<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .mono-box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; rx: 8; ry: 8; }
      .deploy-box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.5; rx: 8; ry: 8; }
      .shared-box { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; rx: 8; ry: 8; }
      .label-title { font-size: 16px; font-weight: 600; fill: #0f172a; }
      .label-sub { font-size: 12px; fill: #475569; }
      .label-meta { font-size: 11px; fill: #64748b; font-style: italic; }
      .group-title { font-size: 13px; font-weight: 600; fill: #1e293b; letter-spacing: 0.05em; }
      .edge-label { font-size: 11px; fill: #475569; }
      .dashed-edge-label { font-size: 11px; fill: #94a3b8; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" class="label-title">hvac-fullstack-portfolio — architecture</text>
  <text x="40" y="60" class="label-meta">Five apps, one shared data package, four deploy targets. Hand-drawn to stay readable in a recruiter skim.</text>

  <!-- Monorepo group -->
  <rect x="40" y="90" width="600" height="280" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" rx="12" ry="12"/>
  <text x="60" y="115" class="group-title">MONOREPO (pnpm workspaces + Turborepo 2)</text>

  <!-- Hub -->
  <rect x="70" y="140" width="200" height="100" class="mono-box"/>
  <text x="85" y="165" class="label-title">apps/hub</text>
  <text x="85" y="185" class="label-sub">Next.js 15 + React 19</text>
  <text x="85" y="205" class="label-sub">Recruiter landing page</text>
  <text x="85" y="225" class="label-meta">4 project cards, tech badges</text>

  <!-- Storefront -->
  <rect x="290" y="140" width="200" height="100" class="mono-box"/>
  <text x="305" y="165" class="label-title">apps/storefront</text>
  <text x="305" y="185" class="label-sub">Next.js 15 + Zustand</text>
  <text x="305" y="205" class="label-sub">HVAC parts eCommerce</text>
  <text x="305" y="225" class="label-meta">Grid, detail, cart, checkout</text>

  <!-- Node API -->
  <rect x="70" y="260" width="200" height="100" class="mono-box"/>
  <text x="85" y="285" class="label-title">apps/api</text>
  <text x="85" y="305" class="label-sub">Node.js 22 + graphql-yoga</text>
  <text x="85" y="325" class="label-sub">GraphQL schema-first</text>
  <text x="85" y="345" class="label-meta">Pothos, in-memory store</text>

  <!-- PHP API -->
  <rect x="290" y="260" width="200" height="100" class="mono-box"/>
  <text x="305" y="285" class="label-title">apps/php-api</text>
  <text x="305" y="305" class="label-sub">Laravel 11 + SQLite</text>
  <text x="305" y="325" class="label-sub">REST + Form Requests</text>
  <text x="305" y="345" class="label-meta">API Resources, PHPUnit</text>

  <!-- Shared data -->
  <rect x="510" y="180" width="120" height="120" class="shared-box"/>
  <text x="525" y="205" class="label-title">packages/</text>
  <text x="525" y="225" class="label-title">shared-data</text>
  <text x="525" y="250" class="label-sub">TS types +</text>
  <text x="525" y="270" class="label-sub">25 HVAC fixtures</text>
  <text x="525" y="290" class="label-meta">subpath exports</text>

  <!-- Edges within monorepo -->
  <!-- Hub reads shared -->
  <line x1="270" y1="190" x2="510" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-dashed)"/>
  <text x="350" y="200" class="dashed-edge-label">reads fixtures</text>

  <!-- Storefront reads shared -->
  <line x1="490" y1="190" x2="510" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-dashed)"/>
  <text x="495" y="215" class="dashed-edge-label">types</text>

  <!-- API reads shared -->
  <line x1="270" y1="310" x2="510" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-dashed)"/>
  <text x="350" y="290" class="dashed-edge-label">seeds store</text>

  <!-- Storefront queries Node API -->
  <path d="M 290 220 Q 200 240 170 260" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="195" y="247" class="edge-label">GraphQL queries</text>

  <!-- Deploy group -->
  <rect x="40" y="410" width="880" height="150" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="4 4" rx="12" ry="12"/>
  <text x="60" y="435" class="group-title">DEPLOY TARGETS</text>

  <rect x="70" y="455" width="200" height="80" class="deploy-box"/>
  <text x="85" y="478" class="label-title">Vercel</text>
  <text x="85" y="498" class="label-sub">hub + storefront</text>
  <text x="85" y="518" class="label-meta">auto-deploy on main</text>

  <rect x="290" y="455" width="200" height="80" class="deploy-box"/>
  <text x="305" y="478" class="label-title">Render</text>
  <text x="305" y="498" class="label-sub">Node API (Docker)</text>
  <text x="305" y="518" class="label-meta">one-click blueprint</text>

  <rect x="510" y="455" width="200" height="80" class="deploy-box"/>
  <text x="525" y="478" class="label-title">Render one-click</text>
  <text x="525" y="498" class="label-sub">PHP API</text>
  <text x="525" y="518" class="label-meta">recruiter can deploy own</text>

  <rect x="730" y="455" width="180" height="80" class="deploy-box"/>
  <text x="745" y="478" class="label-title">GitHub Actions</text>
  <text x="745" y="498" class="label-sub">CI + pre-warm cron</text>
  <text x="745" y="518" class="label-meta">every 10 min demo day</text>

  <!-- App-to-deploy arrows -->
  <line x1="170" y1="240" x2="170" y2="455" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="240" x2="170" y2="455" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="360" x2="390" y2="455" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="360" x2="610" y2="455" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
